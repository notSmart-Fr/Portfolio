{{- if .Site.Data.credentials.credentials }}
<div class="credentials-container">
  {{- range .Site.Data.credentials.credentials }}
  <a class="flyrank-badge-link" 
     href="{{ .verification_url }}" 
     target="{{ .target | default "_blank" }}" 
     rel="{{ .rel | default "noopener noreferrer" }}" 
     title="{{ .title }}">
    <img src="{{ .badge_image | absURL }}" 
         alt="{{ .alt_text }}" 
         width="240" 
         height="56" 
         loading="lazy">
  </a>
  {{- end }}
</div>
{{- end }}
